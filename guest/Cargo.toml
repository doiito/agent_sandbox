[package]
name = "osv-agent-executor"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[features]
default = ["mimalloc"]
mimalloc = ["osv-runtime-allocator/mimalloc", "osv-runtime-allocator/secure"]

[dependencies]
osv-runtime-allocator = { path = "../runtime-allocator", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.release.package.libmimalloc-sys]
opt-level = 3

[[bin]]
name = "osv-agent-executor"
path = "src/main.rs"
