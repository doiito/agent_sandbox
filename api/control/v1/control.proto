  rpc CancelCodeExecution (CancelCodeExecutionRequest) returns (CodeExecutionAcceptedResponseOutput);
  // DELETE /v2/sessions/{id}/ports/{port}/connections/{connection}
  rpc CancelPortConnection (CancelPortConnectionRequest) returns (PortConnectionResponseOutput);
  // DELETE /v2/sessions/{id}/commands/{command}
  rpc CancelSessionCommand (CancelSessionCommandRequest) returns (CommandCancelResponseOutput);
  // GET /v1/capabilities
  rpc Capabilities (CapabilitiesRequest) returns (CapabilityReportOutput);
  // POST /v2/sessions/{id}/contexts
  rpc CreateCodeContext (CreateCodeContextRequest) returns (CodeContextOutput);
  // POST /v2/sessions/{id}/ports/{port}/previews/{preview}
  rpc CreatePreview (CreatePreviewRequest) returns (PreviewGrantInfoOutput);
  // POST /v2/sessions
  rpc CreateSession (CreateSessionRequest) returns (SessionInfoOutput);
  // POST /v2/sessions/{id}/artifacts
  rpc CreateSessionArtifact (CreateSessionArtifactRequest) returns (SessionArtifactInfoOutput);
  // POST /v2/sessions/{id}/contexts/default
  rpc DefaultCodeContext (DefaultCodeContextRequest) returns (CodeContextOutput);
  // DELETE /v2/sessions/{id}
  rpc DeleteSession (DeleteSessionRequest) returns (DeleteSessionResponse);
  // DELETE /v2/sessions/{id}/artifacts/{artifact}
  rpc DeleteSessionArtifact (DeleteSessionArtifactRequest) returns (DeleteSessionArtifactResponse);
  // GET /v2/sessions/{id}/contexts/{context}
  rpc GetCodeContext (GetCodeContextRequest) returns (CodeContextOutput);
  // GET /v2/sessions/{id}/code-executions/{execution}
  rpc GetCodeExecution (GetCodeExecutionRequest) returns (CodeExecutionPageOutput);
  // GET /v2/sessions/{id}/ports/{port}/connections/{connection}
  rpc GetPortConnection (GetPortConnectionRequest) returns (PortConnectionResponseOutput);
  // GET /v2/sessions/{id}/previews/{preview}
  rpc GetPreview (GetPreviewRequest) returns (PreviewGrantInfoOutput);
  // GET /v2/sessions/{id}
  rpc GetSession (GetSessionRequest) returns (SessionInfoOutput);
  // GET /healthz
  rpc Health (HealthRequest) returns (StatusResponseOutput);
  // GET /v1/doctor
  rpc HostDoctor (HostDoctorRequest) returns (DoctorReportOutput);
  // GET /v2/ml/bills/{task}
  rpc InferenceBill (InferenceBillRequest) returns (InferenceBillOutput);
  // POST /v2/sessions/{id}/ml/invocations
  rpc InvokeInference (InvokeInferenceRequest) returns (InferenceInvokeResultOutput);
  // GET /v2/sessions/{id}/contexts
  rpc ListCodeContexts (ListCodeContextsRequest) returns (CodeContextsResponseOutput);
  // GET /v2/sessions/{id}/commands
  rpc ListSessionCommands (ListSessionCommandsRequest) returns (SessionCommandsResponseOutput);
  // GET /v2/sessions/{id}/watches
  rpc ListSessionWatches (ListSessionWatchesRequest) returns (SessionWatchesResponseOutput);
  // GET /v2/sessions
  rpc ListSessions (ListSessionsRequest) returns (SessionListPageOutput);
  // POST /v2/net/fetch
  rpc NetworkFetch (NetworkFetchRequest) returns (NetworkFetchResultOutput);
  // POST /v2/sessions/{id}/ports/{port}/connections/{connection}
  rpc OpenPortTunnel (stream PortClientFrame) returns (stream PortServerFrame);
  // GET /v2/sessions/{id}/commands/{command}/stdin/{sequence}
  rpc PollCommandInput (PollCommandInputRequest) returns (SessionCommandInputReceiptOutput);
  // GET /v2/sessions/{id}/commands/{command}
  rpc PollSessionCommand (PollSessionCommandRequest) returns (SessionCommandPageOutput);
  // GET /v2/sessions/{id}/watches/{watch}
  rpc PollSessionWatch (PollSessionWatchRequest) returns (SessionWatchPageOutput);
  // GET /metrics
  rpc PrometheusMetrics (PrometheusMetricsRequest) returns (MetricsText);
  // POST /v2/sessions/{id}/artifacts/{artifact}/read
  rpc ReadSessionArtifact (ReadSessionArtifactRequest) returns (SessionArtifactChunkOutput);
  // GET /readyz
  rpc Readiness (ReadinessRequest) returns (StatusResponseOutput);
  // DELETE /v2/sessions/{id}/contexts/{context}
  rpc RemoveCodeContext (RemoveCodeContextRequest) returns (CodeContextRemovedResponseOutput);
  // POST /v2/sessions/{id}/contexts/{context}/restart
  rpc RestartCodeContext (RestartCodeContextRequest) returns (CodeContextOutput);
  // DELETE /v2/sessions/{id}/previews/{preview}
  rpc RevokePreview (RevokePreviewRequest) returns (PreviewGrantInfoOutput);
  // POST /v2/jobs
  rpc RunJob (RunJobRequest) returns (RunResultOutput);
  // POST /v1/jobs
  rpc RunLegacyJob (RunLegacyJobRequest) returns (RunResultOutput);
  // POST /v2/sessions/{id}/commands
  rpc RunSessionCommand (RunSessionCommandRequest) returns (SessionCommandResultOutput);
  // GET /v2/sessions/{id}/capabilities
  rpc SessionCapabilities (SessionCapabilitiesRequest) returns (SessionCapabilityReportOutput);
  // POST /v2/sessions/{id}/files
  rpc SessionFile (SessionFileRequest) returns (SessionFileResultOutput);
  // POST /v2/sessions/{id}/timeout
  rpc SetSessionTimeout (SetSessionTimeoutRequest) returns (SessionInfoOutput);
  // POST /v2/sessions/{id}/commands/start
  rpc StartSessionCommand (StartSessionCommandRequest) returns (SessionCommandInfoOutput);
  // POST /v2/sessions/{id}/watches
  rpc StartSessionWatch (StartSessionWatchRequest) returns (SessionWatchInfoOutput);
  // DELETE /v2/sessions/{id}/watches/{watch}
  rpc StopSessionWatch (StopSessionWatchRequest) returns (WatchStopResponseOutput);
  // GET /v2/sessions/{id}/commands/{command}/events
  rpc StreamSessionCommand (StreamSessionCommandRequest) returns (stream SessionCommandStreamEvent);
  // POST /v2/sessions/{id}/code-executions
  rpc SubmitCodeExecution (SubmitCodeExecutionRequest) returns (CodeExecutionPageOutput);
  // POST /v2/sessions/{id}/commands/{command}/stdin
  rpc SubmitCommandInput (SubmitCommandInputRequest) returns (SessionCommandInputReceiptOutput);
  // GET /v2/templates
  rpc TemplateCatalog (TemplateCatalogRequest) returns (TemplateCatalogReportOutput);
}
